---
- name: Configure a single-node monitoring stack
  hosts: monitoring
  become: true
  gather_facts: true

  vars:
    prometheus_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'armv8l'] else 'amd64' }}"
    prometheus_archive: "prometheus-{{ prometheus_version }}.linux-{{ prometheus_arch }}"
    prometheus_download_url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/{{ prometheus_archive }}.tar.gz"

  tasks:
    - name: Ensure supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version | int >= 22
        fail_msg: "This playbook targets Ubuntu 22.04 or newer."

    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - tar
          - prometheus-node-exporter
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure Node Exporter to listen on localhost only
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="--web.listen-address={{ node_exporter_listen_address }}"'
        create: true
        mode: "0644"
      notify: Restart Node Exporter

    - name: Enable and start Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Create Prometheus system group
      ansible.builtin.group:
        name: prometheus
        system: true
        state: present

    - name: Create Prometheus system user
      ansible.builtin.user:
        name: prometheus
        group: prometheus
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create Prometheus directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    - name: Download Prometheus archive
      ansible.builtin.get_url:
        url: "{{ prometheus_download_url }}"
        dest: "/tmp/{{ prometheus_archive }}.tar.gz"
        mode: "0644"

    - name: Extract Prometheus archive
      ansible.builtin.unarchive:
        src: "/tmp/{{ prometheus_archive }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/{{ prometheus_archive }}/prometheus"

    - name: Install Prometheus executable
      ansible.builtin.copy:
        src: "/tmp/{{ prometheus_archive }}/prometheus"
        dest: /usr/local/bin/prometheus
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart Prometheus

    - name: Install promtool executable
      ansible.builtin.copy:
        src: "/tmp/{{ prometheus_archive }}/promtool"
        dest: /usr/local/bin/promtool
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Install Prometheus configuration
      ansible.builtin.template:
        src: ../templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"
      notify: Restart Prometheus

    - name: Create Prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Monitoring
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/ --web.listen-address={{ prometheus_listen_address }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Prometheus

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add Grafana signing key
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL "{{ grafana_apt_key_url }}" | gpg --dearmor --yes -o /etc/apt/keyrings/grafana.gpg
      args:
        creates: /etc/apt/keyrings/grafana.gpg
        executable: /bin/bash

    - name: Configure Grafana apt repository
      ansible.builtin.apt_repository:
        repo: "{{ grafana_apt_repo }}"
        filename: grafana
        state: present

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Configure Prometheus as Grafana data source
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: "0640"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true
      notify: Restart Grafana

    - name: Enable and start Prometheus
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Node Exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted
        daemon_reload: true

    - name: Restart Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
